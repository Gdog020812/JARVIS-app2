workflows:
  ios-workflow:
    name: JARVIS iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies & EAS CLI
        script: |
          npm install
          npm install -g eas-cli
      - name: Build local Expo bundle
        script: |
          npx expo export --platform ios
    artifacts:
      - dist/**/*
      - ios/**/*
