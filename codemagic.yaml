workflows:
  ios-workflow:
    name: JARVIS iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Prebuild iOS project
        script: |
          npx expo prebuild --platform ios --clean
    artifacts:
      - ios/*.tar.gz
      - "*.ipa"
      - "**/build/ios/**/*.ipa"
      - ios/build/Build/Products/Release-iphoneos/*.app
