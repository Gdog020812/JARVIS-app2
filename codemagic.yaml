workflows:
  ios-workflow:
    name: JARVIS iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies & Expo CLI
        script: |
          npm install
          npm install -g eas-cli expo-cli
      - name: Expo Prebuild for iOS
        script: |
          npx expo prebuild --platform ios
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/build/Build/Products/Release-iphoneos/*.app
