workflows:
  ios-workflow:
    name: JARVIS iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Prebuild iOS project
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd ios && pod install
    artifacts:
      - ios/*.ipa
      - "**/build/ios/**/*.ipa"
      - ios/build/Build/Products/Release-iphoneos/*.app
